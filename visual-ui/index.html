<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce QA Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
    <div class="logo">🛒 E-Commerce</div>

    <div class="user">
        Usuario QA
    </div>
</header>

<main class="container">

    <section class="hero">
        <h1>Catálogo de productos</h1>
        <p>
            Interfaz de demostración para Visual Regression Testing
        </p>
    </section>

    <section class="products">

        <article class="product-card">

            <div class="product-image">
                💻
            </div>

            <div class="product-content">

                <h2>Laptop</h2>

                <p class="description">
                    Laptop para trabajo y desarrollo.
                </p>

                <div class="product-footer">

                    <span class="price">
                        $899.99
                    </span>

                    <button>
                        Comprar
                    </button>

                </div>

            </div>

        </article>


        <article class="product-card">

            <div class="product-image">
                📱
            </div>

            <div class="product-content">

                <h2>Smartphone</h2>

                <p class="description">
                    Smartphone de última generación.
                </p>

                <div class="product-footer">

                    <span class="price">
                        $599.99
                    </span>

                    <button>
                        Comprar
                    </button>

                </div>

            </div>

        </article>


        <article class="product-card">

            <div class="product-image">
                🎧
            </div>

            <div class="product-content">

                <h2>Audífonos</h2>

                <p class="description">
                    Audífonos inalámbricos.
                </p>

                <div class="product-footer">

                    <span class="price">
                        $129.99
                    </span>

                    <button>
                        Comprar
                    </button>

                </div>

            </div>

        </article>

    </section>

</main>

<footer class="footer">
    E-Commerce QA Demo — Laboratorio 5.1
</footer>

</body>
</html>
